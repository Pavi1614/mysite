<!DOCTYPE html>
<html>
<body>
<h2>My First Website</h2>
<p>This site is secured with SSL.</p>
<div id="box" style="padding:15px; border-radius:10px;">Checking license...</div>

<script>
fetch('licenses.json')
.then(r => r.json())
.then(data => {
  let box = document.getElementById('box');
  let today = new Date().toISOString().slice(0,10);
  if(data.status === 'active' && data.expiry >= today && data.license_key === 'LIC-PC-2026-001-A1B2C3D4'){
    box.style.background = '#eaffea';
    box.style.border = '2px solid green';
    box.innerHTML = '<h3>✅ License Status: Active & Verified</h3><p><b>License Key:</b> '+data.license_key+'</p><p><b>Machine ID:</b> '+data.machine_id+'</p><p><b>Expiry:</b> '+data.expiry+'</p><p><b>SSL:</b> Secured with HTTPS</p>';
  } else {
    box.style.background = '#ffecec';
    box.style.border = '2px solid red';
    box.innerHTML = '<h3>❌ License Status: Invalid / Expired / Tampered</h3>';
  }
});
</script>
</body>
</html>
